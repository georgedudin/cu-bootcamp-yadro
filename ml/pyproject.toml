[project]
name = "ml"
version = "0.1.0"
description = "ML worker: RQ SimpleWorker + DB glue (George) + pure pipeline funcs (Friend A)"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "core",
    "rq>=2.0",
    "redis>=5.0",
]
# Friend A: add the real ML deps here (faster-whisper, pyannote.audio, speechbrain,
# scikit-learn, torch). Keep them OUT of contracts/core so backend stays lightweight.

[tool.uv.sources]
contracts = { workspace = true }
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]
