[project]
name = "ml"
version = "0.1.0"
description = "ML worker: RQ SimpleWorker + DB glue (George) + pure pipeline funcs (Friend A)"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "core",
    "faster-whisper>=1.2.1",
    "pyannote.audio>=3.1,<4",
    "speechbrain>=1.0",
    "scikit-learn>=1.2",
    "torch>=2.2",
    "rq>=2.0",
    "redis>=5.0",
]

[tool.uv.sources]
contracts = { workspace = true }
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]
