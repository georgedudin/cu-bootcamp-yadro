[project]
name = "yadro-workspace"
version = "0.1.0"
description = "Workspace root — see README.md for who owns what"
requires-python = ">=3.11"
dependencies = ["contracts", "core", "backend", "ml"]

[tool.uv]
package = false

[tool.uv.sources]
contracts = { workspace = true }
core = { workspace = true }
backend = { workspace = true }
ml = { workspace = true }

[tool.uv.workspace]
members = ["contracts", "core", "backend", "ml"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "core/tests", "backend/tests", "ml/tests"]
