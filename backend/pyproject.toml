[project]
name = "backend"
version = "0.1.0"
description = "FastAPI app: REST API, ingest (ffmpeg decode-once + chunking), job enqueue"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "rq>=2.0",
    "redis>=5.0",
]

[tool.uv.sources]
contracts = { workspace = true }
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]
