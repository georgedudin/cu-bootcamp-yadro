[project]
name = "core"
version = "0.1.0"
description = "Shared DB layer: SQLAlchemy models, session, settings, atomic barrier, Alembic"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
