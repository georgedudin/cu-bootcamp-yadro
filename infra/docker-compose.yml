name: yadro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yadro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yadro}
      POSTGRES_DB: ${POSTGRES_DB:-yadro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yadro}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on: queued jobs survive a redis restart (Postgres stays the SoT)
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: infra/dockerfiles/backend.Dockerfile
    restart: unless-stopped
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yadro}:${POSTGRES_PASSWORD:-yadro}@postgres:5432/${POSTGRES_DB:-yadro}
      REDIS_URL: redis://redis:6379/0
      BLOB_DIR: /blob
    volumes:
      - blob:/blob
    ports:
      # Host ports are env-tunable — the deploy box is shared by 6 teams
      # (set YADRO_API_PORT in infra/.env there; defaults suit local dev)
      - "${YADRO_API_PORT:-8000}:8000"   # direct API access; the FE goes via nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  ml-chunk-worker:
    build:
      context: ..
      dockerfile: infra/dockerfiles/ml.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "ml.worker", "chunks"]
    # GPU reservation + offline pins live in docker-compose.gpu.yml (server
    # overlay, applied by scripts/deploy.sh). This base file stays CPU-safe
    # for local `make up`. Keep ONE chunk-worker per GPU (SimpleWorker keeps
    # the models loaded once, in-process).
    environment:
      <<: *app_env
      HF_HOME: /hf
      ECAPA_CACHE_DIR: /hf/ecapa
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
      ML_DEVICE: ${ML_DEVICE:-auto}
      ASR_MODEL: ${ASR_MODEL:-large-v3}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}  # Pascal-friendly hard default
      ASR_LANGUAGE: ${ASR_LANGUAGE:-}              # e.g. ru; empty = autodetect per chunk
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
    volumes:
      - blob:/blob
      - hf_cache:/hf
    depends_on:
      backend:
        condition: service_healthy

  # One-shot model download/load gate — never started by `up` (profile).
  # The ONLY container that sees HF_TOKEN; workers run offline without it.
  # Deploy: scripts/deploy.sh runs it between build and up.
  # Local:  docker compose -f infra/docker-compose.yml run --rm ml-warmup
  ml-warmup:
    build:
      context: ..
      dockerfile: infra/dockerfiles/ml.Dockerfile
    profiles: ["warmup"]
    command: ["python", "-m", "ml.warmup"]
    environment:
      HF_HOME: /hf
      ECAPA_CACHE_DIR: /hf/ecapa
      HF_TOKEN: ${HF_TOKEN:-}
      ML_DEVICE: ${ML_DEVICE:-auto}
      ASR_MODEL: ${ASR_MODEL:-large-v3}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
    volumes:
      - hf_cache:/hf

  ml-reduce-worker:
    build:
      context: ..
      dockerfile: infra/dockerfiles/ml.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "ml.worker", "reduce"]
    environment: *app_env
    volumes:
      - blob:/blob
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: infra/dockerfiles/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${YADRO_HTTP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  blob:
  hf_cache:
