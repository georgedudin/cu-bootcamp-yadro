# Server overlay — applied by scripts/deploy.sh on the GPU box:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.gpu.yml ...
# Needs the NVIDIA Container Toolkit on the host. Local dev Macs never load
# this file; `make up` stays CPU-only via the base compose file.
#
# ML_DEVICE is PINNED to cuda here on purpose: a missing/broken GPU must make
# warmup and the chunk worker fail LOUDLY, never fall back silently to CPU —
# silent CPU fallback is exactly how the first ML deploy burned hours.
services:
  ml-chunk-worker:
    environment:
      ML_DEVICE: cuda
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Warmup validates the full CUDA stack (cudnn/cublas dlopen, VRAM headroom)
  # before deploy.sh replaces the running workers. No offline pin: deploy.sh
  # tries offline first and falls back to an online download run.
  ml-warmup:
    environment:
      ML_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
