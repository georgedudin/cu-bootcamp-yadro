server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads up to 200 MB (task limit) + headroom
    client_max_body_size 250m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ingest is synchronous on upload (ffmpeg decode of a long lecture)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Range headers pass through untouched -> <audio> seeking works
    }

    location / {
        try_files $uri /index.html;
    }
}
